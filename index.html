<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TED学習アプリ</title>
    <style>
        /* 画面を左右に分けるデザイン */
        body { font-family: sans-serif; display: flex; margin: 0; padding: 20px; background-color: #f9f9f9; }
        .video-area { flex: 1; padding-right: 20px; }
        .learning-area { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); height: 85vh; overflow-y: auto; }
        h2 { color: #333; font-size: 1.2rem; border-bottom: 2px solid #e50914; padding-bottom: 5px; }
        .text-box { margin-top: 15px; line-height: 1.8; font-size: 1.1rem; color: #444; }
        button { background-color: #e50914; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #b20710; }
    </style>
</head>
<body>

    <!-- 左側：動画エリア -->
    <div class="video-area">
        <h2>TED Video</h2>
        <!-- YouTubeの埋め込み -->
        <iframe width="100%" height="400" src="https://www.youtube.com/embed/arj7oStGLkU" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- 右側：学習エリア -->
    <div class="learning-area">
        <h2>AI学習エリア（開発中）</h2>
        <button onclick="loadTranscript()">字幕を表示する</button>
        
        <!-- ここに字幕や問題が表示される -->
        <div id="transcript-display" class="text-box">
            ※ボタンを押すと、ここに字幕が出ます。
        </div>
    </div>

    <script>
        // 🌟 ここが超重要！ RenderのAPIが直るまでの「ダミーデータ」
        const dummyTranscript = "Thank you so much. It's a great honor to be here. Today I want to talk about the future of technology and how it will impact our lives. This is just a dummy text for testing our amazing application.";

        function loadTranscript() {
            const display = document.getElementById('transcript-display');
            
            // 本当はここで「fetch('https://ted-learning-app.onrender.com/api/...')」と通信しますが、
            // 今はダミーデータをそのまま画面に出します！
            display.innerText = dummyTranscript;
            
            // 💡 次はこの部分に、「文字を隠して穴埋め問題にするプログラム」を書いていきます！
        }
    </script>

</body>
</html>
