<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }

      .header-area { max-width: 1200px; margin: 0 auto 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
      h2 { color: #2c3e50; margin: 0; }

      .main-container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; align-items: flex-start; flex-wrap: wrap; }

      .video-section { flex: 1; min-width: 500px; }
      .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
      .input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
      button, select { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; transition: 0.3s; }
      button:hover { background-color: #0056b3; }
      button:disabled { background-color: #aaa; cursor: not-allowed; }
      select { background-color: #28a745; }
      #videoTitle { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #444; }
      #player { width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
      .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

      .history-container { margin-top: 20px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
      .history-item { cursor: pointer; color: #007bff; padding: 8px 0; border-bottom: 1px solid #eee; transition: 0.2s; font-size: 0.95em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
      .history-item:hover { color: #0056b3; font-weight: bold; padding-left: 5px; }

      .learning-section { flex: 1; min-width: 400px; display: flex; flex-direction: column; gap: 20px; }
      .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
      .box-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f4f4f9; padding-bottom: 10px; margin-bottom: 10px; }
      .box h3 { margin: 0; color: #007bff; }
      .regen-btn { background-color: #6c757d; font-size: 0.8em; padding: 6px 10px; }
      .regen-btn:hover { background-color: #565e64; }

      .status-line { font-size: 0.9em; color: #666; margin-bottom: 10px; min-height: 1.2em; }
      .status-line.error { color: #c0392b; font-weight: bold; }

      .dictation-item { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed #eee; }
      .dictation-item:last-child { border-bottom: none; }
      .dictation-sentence { font-size: 1.05em; line-height: 1.8; margin-bottom: 8px; }
      .dictation-input { width: 130px; padding: 5px; font-size: 1em; border: 1px solid #007bff; border-radius: 4px; text-align: center; font-weight: bold; }
      .dictation-input.correct { border-color: #27ae60; background-color: #eafaf1; }
      .dictation-input.wrong { border-color: #e74c3c; background-color: #fdecea; }
      .dictation-answer-hint { font-size: 0.85em; color: #888; margin-left: 8px; }
      .check-btn { background-color: #e67e22; width: 100%; margin-top: 10px; }
      .check-btn:hover { background-color: #d35400; }

      .quiz-item { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px dashed #eee; }
      .quiz-item:last-child { border-bottom: none; }
      .quiz-question { font-weight: bold; margin-bottom: 10px; }
      .quiz-options { display: flex; flex-direction: column; gap: 8px; }
      .quiz-option { background-color: #f8f9fa; border: 1px solid #ddd; color: #333; text-align: left; padding: 12px; }
      .quiz-option:hover { background-color: #e2e6ea; }
      .quiz-option.correct { background-color: #d4edda; border-color: #27ae60; color: #1e7e34; font-weight: bold; }
      .quiz-option.wrong { background-color: #f8d7da; border-color: #e74c3c; color: #a71d2a; }
      .quiz-explanation { margin-top: 8px; font-size: 0.9em; color: #555; background: #f4f4f9; padding: 8px 10px; border-radius: 6px; display: none; }
      .placeholder-note { font-size: 0.9em; color: #888; }
    </style>
  </head>
  <body>

    <div class="header-area">
      <h2>TED AI学習 Player</h2>
    </div>

    <div class="main-container">
      <!-- 左側：動画エリア -->
      <div class="video-section">
        <div class="input-area">
          <input type="text" id="urlInput" placeholder="YouTubeのURLを貼り付け">
          <button onclick="loadNewVideo()">読み込む</button>
        </div>
        <div id="videoTitle">📺 動画を読み込んでください</div>
        <div id="player"></div>
        <div class="controls">
          <button onclick="playVideo()">▶ 再生</button>
          <button onclick="pauseVideo()">⏸ 一時停止</button>
          <button onclick="rewind10Seconds()">⏪ 10秒戻る</button>
          <select id="speed" onchange="changeSpeed()">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
          </select>
        </div>
        <div class="history-container">
          <h3>🕒 視聴履歴</h3>
          <div id="historyList">履歴はありません</div>
        </div>
      </div>

      <!-- 右側：学習エリア -->
      <div class="learning-section">
        <div class="box">
          <div class="box-header">
            <h3>✍️ 穴埋めディクテーション</h3>
            <button class="regen-btn" onclick="generateLearningContent()">🔄 再生成</button>
          </div>
          <div class="status-line" id="dictationStatus"></div>
          <div id="dictationContainer">
            <span class="placeholder-note">動画を読み込むと、自動で問題が作られます。</span>
          </div>
          <button class="check-btn" id="dictationCheckBtn" style="display:none;" onclick="checkDictation()">答え合わせをする</button>
        </div>

        <div class="box">
          <div class="box-header">
            <h3>🧠 AI 理解度チェッククイズ</h3>
          </div>
          <div class="status-line" id="quizStatus"></div>
          <div id="quizContainer">
            <span class="placeholder-note">動画を読み込むと、自動で問題が作られます。</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // --- YouTube プレイヤーの仕組み ---
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      var currentVideoId = 'arj7oStGLkU';

      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '360', width: '100%', videoId: currentVideoId,
          playerVars: { 'playsinline': 1, 'rel': 0 },
          events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
        });
        displayHistory();
      }

      function onPlayerReady(event) { updateTitle(); }
      function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) updateTitle();
      }

      function updateTitle() {
        var title = player.getVideoData().title;
        if (title) {
          document.getElementById('videoTitle').innerText = "📺 " + title;
          updateHistoryTitle(currentVideoId, title);
        }
      }

      function loadNewVideo() {
        var url = document.getElementById('urlInput').value;
        var match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*embed\/))([a-zA-Z0-9_-]{11})/);
        if (match && match[1]) {
          currentVideoId = match[1];
          player.loadVideoById(currentVideoId);
          saveToHistory(currentVideoId, url, "タイトル取得中...");
          generateLearningContent();
        } else {
          alert("正しいYouTubeのURLを入力してください！");
        }
      }

      function saveToHistory(videoId, url, title) {
        var history = JSON.parse(localStorage.getItem('ted_history')) || [];
        history = history.filter(item => item.id !== videoId);
        history.unshift({ id: videoId, title: title, date: new Date().toLocaleDateString() });
        if (history.length > 10) history.pop();
        localStorage.setItem('ted_history', JSON.stringify(history));
        displayHistory();
      }

      function updateHistoryTitle(videoId, title) {
        var history = JSON.parse(localStorage.getItem('ted_history')) || [];
        for (var i = 0; i < history.length; i++) {
          if (history[i].id === videoId) { history[i].title = title; break; }
        }
        localStorage.setItem('ted_history', JSON.stringify(history));
        displayHistory();
      }

      function displayHistory() {
        var history = JSON.parse(localStorage.getItem('ted_history')) || [];
        var listHtml = "";
        history.forEach(function (item) {
          listHtml += `<div class="history-item" onclick="loadFromHistory('${item.id}')" title="${item.title}">▶ [${item.date}] ${item.title}</div>`;
        });
        document.getElementById('historyList').innerHTML = listHtml || "履歴はありません";
      }

      function loadFromHistory(videoId) {
        currentVideoId = videoId;
        player.loadVideoById(videoId);
        generateLearningContent();
      }
      function playVideo() { player.playVideo(); }
      function pauseVideo() { player.pauseVideo(); }
      function rewind10Seconds() { player.seekTo(player.getCurrentTime() - 10, true); }
      function changeSpeed() { player.setPlaybackRate(parseFloat(document.getElementById('speed').value)); }

      // --- 字幕取得 → Gemini問題生成(同一オリジンの /api を呼ぶだけ) ---
      async function generateLearningContent() {
        var dictationStatus = document.getElementById('dictationStatus');
        var quizStatus = document.getElementById('quizStatus');
        var dictationContainer = document.getElementById('dictationContainer');
        var quizContainer = document.getElementById('quizContainer');
        var checkBtn = document.getElementById('dictationCheckBtn');

        dictationContainer.innerHTML = "";
        quizContainer.innerHTML = "";
        checkBtn.style.display = "none";
        dictationStatus.className = "status-line";
        quizStatus.className = "status-line";
        dictationStatus.innerText = "📥 字幕を取得中...";
        quizStatus.innerText = "";

        var transcriptText;
        try {
          var res = await fetch(`/api/transcript?v=${currentVideoId}`);
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || "字幕取得に失敗しました");
          transcriptText = data.text;
        } catch (e) {
          dictationStatus.innerText = "❌ " + e.message;
          dictationStatus.className = "status-line error";
          return;
        }

        dictationStatus.innerText = "🤖 AIが問題を作成中...（数十秒かかることがあります）";
        try {
          var quizRes = await fetch(`/api/generate-quiz`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ transcript: transcriptText })
          });
          var quizData = await quizRes.json();
          if (!quizRes.ok) throw new Error(quizData.error || "問題生成に失敗しました");

          dictationStatus.innerText = "";
          quizStatus.innerText = "";
          renderDictation(quizData.dictation || []);
          renderQuiz(quizData.quiz || []);
        } catch (e) {
          dictationStatus.innerText = "❌ " + e.message;
          dictationStatus.className = "status-line error";
        }
      }

      function renderDictation(items) {
        var container = document.getElementById('dictationContainer');
        var checkBtn = document.getElementById('dictationCheckBtn');
        if (!items.length) {
          container.innerHTML = '<span class="placeholder-note">問題を生成できませんでした。</span>';
          return;
        }
        var html = "";
        items.forEach(function (item, i) {
          html += `
            <div class="dictation-item">
              <div class="dictation-sentence">
                ${escapeHtml(item.before)}<input type="text" class="dictation-input" id="dictation-input-${i}" data-answer="${escapeAttr(item.answer)}" placeholder="????">${escapeHtml(item.after)}
              </div>
            </div>`;
        });
        container.innerHTML = html;
        checkBtn.style.display = "block";
      }

      function checkDictation() {
        var inputs = document.querySelectorAll('.dictation-input');
        inputs.forEach(function (input) {
          var answer = (input.dataset.answer || "").trim().toLowerCase();
          var value = input.value.trim().toLowerCase();
          input.classList.remove('correct', 'wrong');
          input.classList.add(value === answer ? 'correct' : 'wrong');

          var existingHint = input.parentElement.querySelector('.dictation-answer-hint');
          if (existingHint) existingHint.remove();
          if (value !== answer) {
            var hint = document.createElement('span');
            hint.className = 'dictation-answer-hint';
            hint.innerText = "正解: " + input.dataset.answer;
            input.insertAdjacentElement('afterend', hint);
          }
        });
      }

      function renderQuiz(items) {
        var container = document.getElementById('quizContainer');
        if (!items.length) {
          container.innerHTML = '<span class="placeholder-note">問題を生成できませんでした。</span>';
          return;
        }
        var html = "";
        items.forEach(function (item, qi) {
          html += `<div class="quiz-item"><div class="quiz-question">Q${qi + 1}. ${escapeHtml(item.question)}</div><div class="quiz-options">`;
          item.options.forEach(function (opt, oi) {
            html += `<button class="quiz-option" onclick="answerQuiz(${qi}, ${oi})">${String.fromCharCode(65 + oi)}. ${escapeHtml(opt)}</button>`;
          });
          html += `</div><div class="quiz-explanation" id="quiz-explanation-${qi}">${escapeHtml(item.explanation || "")}</div></div>`;
        });
        container.innerHTML = html;
        window.__quizData = items;
      }

      function answerQuiz(questionIndex, optionIndex) {
        var item = window.__quizData[questionIndex];
        var quizItems = document.querySelectorAll('.quiz-item');
        var buttons = quizItems[questionIndex].querySelectorAll('.quiz-option');
        buttons.forEach(function (btn, i) {
          btn.classList.remove('correct', 'wrong');
          btn.disabled = true;
          if (i === item.correct_index) btn.classList.add('correct');
          else if (i === optionIndex) btn.classList.add('wrong');
        });
        document.getElementById('quiz-explanation-' + questionIndex).style.display = 'block';
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }
    </script>
  </body>
</html>
